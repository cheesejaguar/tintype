name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-15
            platform: macos-arm64
          - name: macOS ARM64 portable CPU
            runner: macos-15
            features: --features portable-cpu
          - name: Linux x86-64
            runner: ubuntu-22.04
            platform: linux-x86_64
          - name: Linux x86
            runner: ubuntu-22.04
            platform: linux-x86
            target: i686-unknown-linux-gnu
          - name: Linux ARM64
            runner: ubuntu-22.04-arm
            platform: linux-arm64
          - name: Windows x86-64
            runner: windows-2022
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
          - name: Windows x86
            runner: windows-2022
            platform: windows-x86
            target: i686-pc-windows-msvc
    env:
      PLATFORM: ${{ matrix.platform }}
      TARGET: ${{ matrix.target }}
      EXE: ${{ startsWith(matrix.platform, 'windows') && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          if [ -n "$TARGET" ]; then rustup target add --toolchain stable "$TARGET"; fi
      - if: matrix.platform == 'linux-x86'
        name: Install the 32-bit C toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: cargo +stable test --release --locked ${TARGET:+--target "$TARGET"} ${{ matrix.features }}
      - if: matrix.platform
        name: Build
        run: |
          cargo +stable build --release --locked --bin tintype ${TARGET:+--target "$TARGET"}
          echo "BIN=target/${TARGET:+$TARGET/}release/tintype$EXE" >> "$GITHUB_ENV"
      - if: matrix.platform && !startsWith(matrix.platform, 'windows')
        name: Bundle and check the installer
        run: |
          scripts/pack.sh "$PLATFORM" dist "$BIN"
          scripts/pack-models.sh dist "$BIN"
          scripts/checksums.sh dist
          if [ "$PLATFORM" = linux-x86 ]; then
            # An i686 kernel personality, then a pure 32-bit Debian userland.
            linux32 sh scripts/test-install.sh dist
            docker run --rm --platform linux/386 -v "$PWD:/src:ro" -w /src \
              i386/debian:bookworm-slim sh scripts/test-install.sh dist
          else
            scripts/test-install.sh dist
          fi
      - if: startsWith(matrix.platform, 'windows')
        name: Bundle the Windows release
        shell: pwsh
        run: scripts/pack.ps1 $env:PLATFORM dist $env:BIN
      - if: startsWith(matrix.platform, 'windows')
        name: Bundle the models
        run: |
          sh scripts/pack-models.sh dist "$BIN"
          sh scripts/checksums.sh dist
      - if: startsWith(matrix.platform, 'windows')
        name: Check the Windows installer
        shell: pwsh
        run: scripts/test-install.ps1 dist $env:PLATFORM
  provenance:
    name: Offline Content Credentials (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-22.04, ubuntu-22.04-arm, windows-2022]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --release --locked --features provenance --test provenance
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build --target bundled --tag tintype:ci .
      - name: Smoke test the container
        run: |
          docker run --rm tintype:ci demo --device cpu --json | jq -e '.fixture_label == "ai-generated" and (.score | type == "number")'
          docker run --detach --init --name tintype-ci --env TINTYPE_API_TOKEN=tintype-ci-token -p 127.0.0.1:8080:8080 tintype:ci
          trap 'docker logs tintype-ci; docker stop tintype-ci' EXIT
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 \
            --max-time 2 --output health.json http://127.0.0.1:8080/healthz
          jq -e '.status == "ok"' health.json
          curl --fail --silent --show-error -H 'Authorization: Bearer tintype-ci-token' \
            -F 'file=@site/assets/demo.png' http://127.0.0.1:8080/v1/detect | jq -e '.kind == "image" and (.score | type == "number")'
