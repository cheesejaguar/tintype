# Temporary: times the INT8 kernels against single precision on hosted
# runners (docs/runbooks/cpu-profile-int8.md). Removed before merging.
name: INT8 benchmark

on:
  push:
    branches: [research/fast-options]
    paths: [src/cpu_vit.rs, src/cpu_vit/**, .github/workflows/int8-bench.yml]

permissions:
  contents: read

jobs:
  bench:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, name: Linux x86-64 }
          - { runner: ubuntu-24.04-arm, name: Linux ARM64 }
          - { runner: windows-2022, name: Windows x86-64 }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - name: Processor
        run: |
          if [ "$RUNNER_OS" = Linux ]; then nproc; grep -m1 -E 'model name|CPU part' /proc/cpuinfo || true; grep -o -m1 -E 'avx512_vnni|avx_vnni|avx2|asimddp' /proc/cpuinfo | sort -u || true; fi
          if [ "$RUNNER_OS" = Windows ]; then echo "$NUMBER_OF_PROCESSORS processors"; echo "$PROCESSOR_IDENTIFIER"; fi
      - name: Kernel tests
        run: cargo +stable test --release --locked --lib cpu_vit
      - name: Kernel benchmark (block linear layers)
        run: |
          cargo +stable test --release --locked --lib int8_against_f32 -- --ignored --nocapture
          if [ "$RUNNER_OS" != macOS ]; then TINTYPE_INT8_KERNEL=avx2 cargo +stable test --release --locked --lib int8_against_f32 -- --ignored --nocapture; fi
      - name: Whole network, file to verdict
        run: |
          cargo +stable build --release --locked --bin tintype
          bin=target/release/tintype
          [ "$RUNNER_OS" = Windows ] && bin=target/release/tintype.exe
          root=$PWD
          [ "$RUNNER_OS" = Windows ] && root=$(cygpath -m "$PWD")
          : > bench.tsv
          for i in $(seq 1 100); do
            printf '%s\t1\tdemo\tdemo\n' "$root/site/assets/demo.png" >> bench.tsv
            printf '%s\t1\tdemo\tdemo\n' "$root/docs/assets/provenance-original.png" >> bench.tsv
          done
          for round in 1 2 3; do
            for dev in cpu cpu-int8; do
              echo "== latency, $dev, round $round"
              "$bin" latency --weights models/tintype.safetensors --manifest bench.tsv --n 100 --device "$dev"
            done
          done
          mkdir -p photos
          for i in $(seq 1 100); do
            cp site/assets/demo.png "photos/demo-$i.png"
            cp docs/assets/provenance-original.png "photos/original-$i.png"
          done
          for round in 1 2 3; do
            for dev in cpu cpu-int8; do
              start=$(date +%s.%N)
              "$bin" detect --weights models/tintype.safetensors --device "$dev" photos/* > /dev/null || true
              end=$(date +%s.%N)
              echo "== throughput, $dev, round $round: 200 photos in $(awk "BEGIN{print $end - $start}") s"
            done
          done
      - name: AVX2 against VNNI (x86-64)
        if: runner.os != 'macOS'
        run: |
          bin=target/release/tintype
          [ "$RUNNER_OS" = Windows ] && bin=target/release/tintype.exe
          for round in 1 2 3; do
            for kernel in avx2 best; do
              echo "== latency, cpu-int8, kernel $kernel, round $round"
              TINTYPE_INT8_KERNEL=$kernel "$bin" latency --weights models/tintype.safetensors --manifest bench.tsv --n 100 --device cpu-int8
            done
          done
