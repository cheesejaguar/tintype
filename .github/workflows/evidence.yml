name: External image benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arena:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - name: Install FFmpeg if needed
        run: command -v ffmpeg || brew install ffmpeg
      - run: cargo +stable build --release --locked --bin tintype
      - name: Recompute the archived Arena tables
        run: |
          python3 scripts/report-archive.py docs/results/arena-v0.1-cpu/scores.tsv.gz \
            --tintype target/release/tintype > arena-archived.md
          diff <(grep -E '^\*\*arena-|^\| (Tintype|Community Forensics) \|' docs/results/arena-v0.1-cpu/report.md) \
               <(grep -E '^\*\*arena-|^\| (Tintype|Community Forensics) \|' arena-archived.md)
      - name: Run AI Detector Arena
        run: |
          python3 scripts/evaluate-arena.py arena-results \
            --tintype target/release/tintype --weights models/tintype.safetensors --with-commfor --device cpu --jobs 3
          cat arena-results/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: arena-results
          path: |
            arena-results/report.md
            arena-results/run.json
            arena-results/*.tsv
            arena-results/*.tsv.gz
          if-no-files-found: error
