name: External image benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/evaluate-arena.py
      - scripts/benchmark_images.py
      - scripts/stress-photo.py
      - .github/workflows/evidence.yml

permissions:
  contents: read

jobs:
  arena:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - name: Install FFmpeg if needed
        run: command -v ffmpeg || brew install ffmpeg
      - run: cargo +stable build --release --locked --bin tintype
      - name: Run AI Detector Arena
        run: |
          python3 scripts/evaluate-arena.py arena-results \
            --tintype target/release/tintype --weights models/tintype.safetensors --with-commfor --device cpu --jobs 3
          cat arena-results/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: arena-results
          path: |
            arena-results/report.md
            arena-results/run.json
            arena-results/*.tsv
            arena-results/*.tsv.gz
          if-no-files-found: error
