name: Release containers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag (for example v0.1.0)
        required: true
        type: string
      publish:
        description: Push both verified image variants to GHCR
        default: false
        type: boolean

permissions:
  contents: read
  attestations: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-containers-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build Linux ${{ matrix.arch }}
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || !inputs.publish
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify release provenance and stage the binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,tagName |
            jq -e --arg tag "$RELEASE_TAG" '.tagName == $tag and ((.isDraft or .isPrerelease) | not)'
          gh release download "$RELEASE_TAG" --dir release-assets \
            --pattern SHA256SUMS --pattern "tintype-$PLATFORM.tar.gz" --pattern tintype-models.tar.gz
          source_digest=$(git ls-remote "$GITHUB_SERVER_URL/$GH_REPO.git" "refs/tags/$RELEASE_TAG^{}" | cut -f1)
          if [[ -z "$source_digest" ]]; then
            source_digest=$(git ls-remote "$GITHUB_SERVER_URL/$GH_REPO.git" "refs/tags/$RELEASE_TAG" | cut -f1)
          fi
          [[ "$source_digest" =~ ^[a-f0-9]{40}$ ]]
          for asset in SHA256SUMS "tintype-$PLATFORM.tar.gz" tintype-models.tar.gz; do
            gh attestation verify "release-assets/$asset" --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
              --source-ref "refs/tags/$RELEASE_TAG" --source-digest "$source_digest"
          done
          scripts/stage-container-release.sh "$PLATFORM" release-assets container-release
          echo "RELEASE_SOURCE=$source_digest" >> "$GITHUB_ENV"
      - name: Build and smoke-test both variants
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          for variant in code-only bundled; do
            license='MIT OR Apache-2.0'
            if [[ "$variant" == bundled ]]; then
              license='(MIT OR Apache-2.0) AND CC-BY-NC-SA-4.0'
            fi
            docker build --platform "linux/$ARCH" --target "release-$variant" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$RELEASE_SOURCE" \
              --label "org.opencontainers.image.version=${RELEASE_TAG#v}" \
              --label "org.opencontainers.image.licenses=$license" \
              --tag "tintype-$variant:$ARCH" .
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "tintype-$variant:$ARCH")" = "linux/$ARCH"
            test "$(docker run --rm "tintype-$variant:$ARCH" --version)" = "tintype ${RELEASE_TAG#v}"
          done
          scripts/test-container.sh "tintype-bundled:$ARCH" "tintype-code-only:$ARCH" container-release/models
      - name: Save both tested images
        if: inputs.publish
        env:
          ARCH: ${{ matrix.arch }}
        run: docker save "tintype-code-only:$ARCH" "tintype-bundled:$ARCH" | gzip -1 > "tintype-$ARCH-images.tar.gz"
      - uses: actions/upload-artifact@v7
        if: inputs.publish
        with:
          name: container-${{ matrix.arch }}
          path: tintype-${{ matrix.arch }}-images.tar.gz
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish the verified multi-platform images
    if: inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: container-*
          merge-multiple: true
          path: images
      - name: Sign in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Load the tested images and publish their indexes
        id: publish
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          for arch in amd64 arm64; do
            docker load --input "images/tintype-$arch-images.tar.gz"
          done
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          for variant in code-only bundled; do
            repository=$image
            output=code
            if [[ "$variant" == bundled ]]; then
              repository="$image-bundled"
              output=bundled
            fi
            for arch in amd64 arm64; do
              docker tag "tintype-$variant:$arch" "$repository:$RELEASE_TAG-$arch"
              docker push "$repository:$RELEASE_TAG-$arch"
            done
            docker buildx imagetools create --tag "$repository:$RELEASE_TAG" \
              --metadata-file index.json "$repository:$RELEASE_TAG-amd64" "$repository:$RELEASE_TAG-arm64"
            digest=$(jq -er '."containerimage.descriptor".digest' index.json)
            docker buildx imagetools inspect --raw "$repository@$digest" |
              jq -e '([.manifests[].platform | select(.os == "linux") | .architecture] | sort) == ["amd64","arm64"]'
            echo "${output}_name=$repository" >> "$GITHUB_OUTPUT"
            echo "${output}_digest=$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Attest the code-only image
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.publish.outputs.code_name }}
          subject-digest: ${{ steps.publish.outputs.code_digest }}
          push-to-registry: true
      - name: Attest the bundled image
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.publish.outputs.bundled_name }}
          subject-digest: ${{ steps.publish.outputs.bundled_digest }}
          push-to-registry: true
      - name: Report the published images
        env:
          CODE_NAME: ${{ steps.publish.outputs.code_name }}
          CODE_DIGEST: ${{ steps.publish.outputs.code_digest }}
          BUNDLED_NAME: ${{ steps.publish.outputs.bundled_name }}
          BUNDLED_DIGEST: ${{ steps.publish.outputs.bundled_digest }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          printf 'Published Linux amd64 and arm64 images for `%s`.\n\n- `%s@%s`\n- `%s@%s`\n' \
            "$RELEASE_TAG" "$CODE_NAME" "$CODE_DIGEST" "$BUNDLED_NAME" "$BUNDLED_DIGEST" >> "$GITHUB_STEP_SUMMARY"
