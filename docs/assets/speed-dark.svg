<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 238" width="820" height="238" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'><title id="t">Photo throughput in photos per second</title><desc id="d">GPU: Tintype 530 to 563, Tintype with second opinion 281 to 288, Community Forensics as released 82, Community Forensics ported to this engine 291 to 295. CPU: Tintype 77 to 78, with second opinion 39 to 41, Community Forensics as released 26, ported 39 to 42.</desc><text x="0.0" y="18.0" fill="#f0efec" font-size="15" font-weight="600" text-anchor="start">Photo throughput</text><text x="0.0" y="36.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Photos per second, file to verdict, on 2,096 photos of the newest blind batch (Apple M6). Longer is better.</text><text x="0.0" y="66.0" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">Apple GPU</text><line x1="172.0" y1="80" x2="172.0" y2="200" stroke="#383835" stroke-width="1"/><text x="172.0" y="214.0" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">0</text><line x1="227.0" y1="80" x2="227.0" y2="200" stroke="#2c2c2a" stroke-width="1"/><text x="227.0" y="214.0" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">200</text><line x1="282.0" y1="80" x2="282.0" y2="200" stroke="#2c2c2a" stroke-width="1"/><text x="282.0" y="214.0" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">400</text><line x1="337.0" y1="80" x2="337.0" y2="200" stroke="#2c2c2a" stroke-width="1"/><text x="337.0" y="214.0" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">600</text><text x="164.0" y="99.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="end">Tintype</text><path d="M172.0,87.0 h146.3 a4.0,4.0 0 0 1 4.0,4.0 v8.0 a4.0,4.0 0 0 1 -4.0,4.0 h-146.3 z" fill="#3987e5"/><text x="328.3" y="99.0" fill="#f0efec" font-size="12" font-weight="600" text-anchor="start">530–563</text><text x="164.0" y="129.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="end">Tintype + second opinion</text><path d="M172.0,117.0 h74.2 a4.0,4.0 0 0 1 4.0,4.0 v8.0 a4.0,4.0 0 0 1 -4.0,4.0 h-74.2 z" fill="#d95926"/><text x="256.2" y="129.0" fill="#f0efec" font-size="12" font-weight="600" text-anchor="start">281–288</text><text x="164.0" y="159.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="end">Community Forensics</text><path d="M172.0,147.0 h18.6 a4.0,4.0 0 0 1 4.0,4.0 v8.0 a4.0,4.0 0 0 1 -4.0,4.0 h-18.6 z" fill="#199e70"/><text x="200.6" y="159.0" fill="#f0efec" font-size="12" font-weight="600" text-anchor="start">82</text><text x="164.0" y="189.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="end">…ported to this engine*</text><path d="M172.0,177.0 h76.6 a4.0,4.0 0 0 1 4.0,4.0 v8.0 a4.0,4.0 0 0 1 -4.0,4.0 h-76.6 z" fill="#898781"/><text x="258.6" y="189.0" fill="#f0efec" font-size="12" font-weight="600" text-anchor="start">291–295</text><text x="425.0" y="66.0" fill="#f0efec" font-size="13" font-weight="600" text-anchor="start">CPU</text><line x1="597.0" y1="80" x2="597.0" y2="200" stroke="#383835" stroke-width="1"/><text x="597.0" y="214.0" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">0</text><line x1="638.2" y1="80" x2="638.2" y2="200" stroke="#2c2c2a" stroke-width="1"/><text x="638.2" y="214.0" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">25</text><line x1="679.5" y1="80" x2="679.5" y2="200" stroke="#2c2c2a" stroke-width="1"/><text x="679.5" y="214.0" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">50</text><line x1="720.8" y1="80" x2="720.8" y2="200" stroke="#2c2c2a" stroke-width="1"/><text x="720.8" y="214.0" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">75</text><line x1="762.0" y1="80" x2="762.0" y2="200" stroke="#2c2c2a" stroke-width="1"/><text x="762.0" y="214.0" fill="#898781" font-size="11" fon