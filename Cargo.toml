[package]
name = "tintype"
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Fast AI-generated image and video detection in pure Rust"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "multipart", "tokio"] }
c2pa = { version = "=0.92.1", optional = true, default-features = false, features = ["rust_native_crypto"] }
candle-core = "0.11"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
fast_image_resize = "6.1.0"
flate2 = "1.1.11"
gemm = "0.19"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
parquet = { version = "60.1.0", default-features = false, features = ["snap", "zstd", "lz4", "flate2", "brotli", "flate2-rust_backend"] }
rayon = "1.12.0"
rust_h264 = "0.6.1"
rust_h265 = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6"
tar = "0.4.46"
tempfile = "3.27"
tokio = { version = "1", features = ["fs", "io-util", "net", "rt", "signal", "sync", "time"] }
ureq = "3.5.1"
walkdir = "2.5.0"
zip = "9.5.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# Apple GPU engine (MPSGraph) and system video decoding.
[target.'cfg(target_os = "macos")'.dependencies]
half = "2.7.1"
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-av-foundation = { version = "0.3.2", features = ["objc2-core-media", "objc2-core-video", "objc2-core-foundation"] }
objc2-core-media = { version = "0.3.2", features = ["objc2-core-video"] }
objc2-core-video = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-metal = "0.3.2"
objc2-metal-performance-shaders = "0.3.2"
objc2-metal-performance-shaders-graph = "0.3.2"

[features]
# Use the pure-Rust CPU kernels on macOS too (they are the only ones elsewhere).
portable-cpu = []
provenance = ["dep:c2pa"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false
